<div
  [class.invoice-studio--preview]="studio.mobileView() === studio.mobileViews.preview"
  class="invoice-studio">
  <app-invoice-studio-rail class="invoice-studio__rail-host" />
  <app-invoice-studio-content class="invoice-studio__content-host" />
  <div
    [class.invoice-studio__toast--visible]="studio.toastMessage()"
    class="invoice-studio__toast"
    role="status">
    {{ studio.toastMessage() }}
  </div>
</div>
